# CI/CD pipeline — 4-stage promotion model:
#
#   quality-gate  →  deploy-dev (auto)  →  deploy-qual (auto)  →  deploy-prod (manual approval)
#
# The `environment:` key on each deploy job links it to a GitHub Environment.
# The "production" environment is configured with required reviewers — GitHub
# pauses the pipeline and waits for a human to click "Approve" before prod runs.
#
# Space names (dev / qual / prod) are not secrets — hardcoded directly.
# Sensitive credentials stay in repo-level secrets: CF_API, CF_ORG, CF_USER, CF_PASSWORD.

name: Build & Deploy to Cloud Foundry

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — QUALITY GATE
  # Must pass before any deployment starts.
  # ---------------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CAP dev kit
        run: npm install -g @sap/cds-dk

      - name: Install dependencies
        run: npm ci

      - name: Compile check (cds build)
        run: npx cds build --production

      - name: Run tests (if any)
        run: npm test --if-present

  # ---------------------------------------------------------------------------
  # JOB 2 — DEPLOY TO DEV  (automatic after gate passes)
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @sap/cds-dk mbt
      - run: npm ci
      - run: mbt build

      - name: Install cf CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f

      - name: Deploy to dev
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth "${{ secrets.CF_USER }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o "${{ secrets.CF_ORG }}" -s dev
          cf deploy mta_archives/*.mtar -f

  # ---------------------------------------------------------------------------
  # JOB 3 — DEPLOY TO QUAL  (automatic after dev succeeds)
  # ---------------------------------------------------------------------------
  deploy-qual:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @sap/cds-dk mbt
      - run: npm ci
      - run: mbt build

      - name: Install cf CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f

      - name: Deploy to qual
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth "${{ secrets.CF_USER }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o "${{ secrets.CF_ORG }}" -s qual
          cf deploy mta_archives/*.mtar -f

  # ---------------------------------------------------------------------------
  # JOB 4 — DEPLOY TO PROD  (requires manual approval in GitHub UI)
  # The "production" environment has required reviewers configured —
  # GitHub pauses HERE and shows an "Approve deployment" button.
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: deploy-qual
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @sap/cds-dk mbt
      - run: npm ci
      - run: mbt build

      - name: Install cf CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f

      - name: Deploy to prod
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth "${{ secrets.CF_USER }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o "${{ secrets.CF_ORG }}" -s prod
          cf deploy mta_archives/*.mtar -f
